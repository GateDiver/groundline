<meta charset="utf-8">
<title>Groundline · Pulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground-950: #0d0f14;
  --ground-900: #12141b;
  --paper: #f3ecdc;
  --paper-panel: #ffffff;
  --ink: #221c11;
  --ink-dim: #6b6152;
  --line: #ddd2ba;
  --accent: #a05f26;
  --v-verified: #3f7a4a;
  --v-wrong: #b3503f;
  --v-uncertain: #5b6472;
  --v-subjective: #7a5aa8;
  --v-self: #2e7d8a;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --display: 'Fraunces', Georgia, serif;
  --body-font: 'Work Sans', -apple-system, 'Noto Sans TC', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: var(--ground-950);
    --paper-panel: var(--ground-900);
    --ink: #ede4d2;
    --ink-dim: #a89a80;
    --line: #2c2b30;
    --accent: #d3944f;
    --v-verified: #6fbf7c; --v-wrong: #e08672; --v-uncertain: #9aa4b2;
    --v-subjective: #b39ce0; --v-self: #5fc4d1;
  }
}
:root[data-theme="dark"] {
  --paper: var(--ground-950); --paper-panel: var(--ground-900);
  --ink: #ede4d2; --ink-dim: #a89a80; --line: #2c2b30; --accent: #d3944f;
  --v-verified: #6fbf7c; --v-wrong: #e08672; --v-uncertain: #9aa4b2;
  --v-subjective: #b39ce0; --v-self: #5fc4d1;
}
:root[data-theme="light"] {
  --paper: #f3ecdc; --paper-panel: #ffffff;
  --ink: #221c11; --ink-dim: #6b6152; --line: #ddd2ba; --accent: #a05f26;
  --v-verified: #3f7a4a; --v-wrong: #b3503f; --v-uncertain: #5b6472;
  --v-subjective: #7a5aa8; --v-self: #2e7d8a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body-font); line-height: 1.6; overflow-x: hidden;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 80px; }
.eyebrow {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
}
h1 {
  font-family: var(--display); font-weight: 600; font-size: clamp(1.8rem, 4.5vw, 2.6rem);
  margin: 0 0 12px; text-wrap: balance;
}
.caveat {
  color: var(--ink-dim); font-size: 0.88rem; max-width: 66ch; margin: 0 0 28px;
  border-left: 2px solid var(--accent); padding-left: 14px;
}
.stage {
  background: var(--paper-panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 8px 8px 0; overflow: hidden; position: relative;
}
svg { display: block; width: 100%; height: auto; }
.legend {
  display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 4px 0;
  font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.15s;
  background: var(--ink); color: var(--paper); font-family: var(--body-font);
  font-size: 0.78rem; padding: 8px 12px; border-radius: 8px; max-width: 280px;
  transform: translate(-50%, -100%); z-index: 5;
}
.tip.show { opacity: 1; }
.tip .t-claim { font-weight: 600; margin-bottom: 2px; }
.tip .t-meta { opacity: 0.7; font-family: var(--mono); font-size: 0.7rem; }
footer.note {
  margin-top: 28px; font-size: 0.82rem; color: var(--ink-dim);
}
footer.note a { color: var(--accent); }
.source-block { margin-bottom: 32px; }
.source-h {
  font-family: var(--mono); font-size: 0.82rem; font-weight: 600;
  color: var(--ink); margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
}
.source-h .n { color: var(--ink-dim); font-weight: 400; }
template { display: none; }
.lang-toggle {
  position: absolute; top: 48px; right: 24px;
  display: inline-flex; font-family: var(--mono); font-size: 0.72rem;
  border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
}
.lang-toggle button {
  background: none; border: none; padding: 6px 12px; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: inherit;
}
.lang-toggle button.active { background: var(--accent); color: #fff; }
@media (max-width: 640px) {
  .lang-toggle { position: static; margin-bottom: 16px; }
}
</style>

<div class="wrap" style="position: relative;">
  <div class="lang-toggle" id="langToggle">
    <button data-lang="zh">中</button>
    <button data-lang="en">EN</button>
  </div>
  <div class="eyebrow">Groundline · pulse · audio-track</div>
  <h1 id="tHeading"></h1>
  <p class="caveat" id="tCaveat"></p>
  <div class="legend" id="tLegend"></div>
  <div id="sources"></div>
  <footer class="note" id="tFooter"></footer>
</div>

<template id="stageTpl">
  <section class="source-block">
    <h2 class="source-h"></h2>
    <div class="stage">
      <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tip"><div class="t-claim"></div><div class="t-meta"></div></div>
    </div>
  </section>
</template>

<script>
const I18N = {
  zh: {
    heading: "不是AI的心跳，是AI內心工作空間的聲軌",
    caveat: "這不是模型內部的真實活動訊號——那一層需要白箱權限，外部工具拿不到。這張圖畫的是我們自己收集的行為代理訊號，用混音台/示波器的錶頭語言呈現：判斷越重大，那一格就越大聲。不是要暗示AI有生理反應，是把內部本來就在跑的多條訊號攤開來給你看。每個AI各自一張圖，不合併成一張——不同來源的訊號本來就不該疊在一起假裝是同一條軌。",
    legend: ["verified", "inferred_wrong", "uncertain", "subjective", "self_report", "情緒（自報，未驗證）"],
    footerLink: "回到時間線",
    footerSrc: "資料來源：",
    evidenceLabel: "情緒·自報·未驗證",
    errFetch: (msg) => `data.json 讀取失敗（${msg}）——本機直接開檔案會因為 file:// 限制讀不到，需要從 HTTP 來源開。`
  },
  en: {
    heading: "Not a heartbeat — the sound of an AI's own workspace",
    caveat: "This isn't a real internal activity signal from the model — that layer needs white-box access outside tools don't have. This chart shows behavioral-proxy signals we collected ourselves, rendered in the language of a mixing board or oscilloscope: the more significant the judgment, the louder that block. It's not implying the AI has a physiological response — it's laying out several signals already running inside, in the open. Each AI gets its own chart, never merged — signals from different sources shouldn't be stacked and pretended to be one track.",
    legend: ["verified", "inferred_wrong", "uncertain", "subjective", "self_report", "emotion (self-reported, unverified)"],
    footerLink: "back to timeline",
    footerSrc: "Source: ",
    evidenceLabel: "emotion · self-reported · unverified",
    errFetch: (msg) => `Failed to load data.json (${msg}) — opening the file directly won't work due to the browser's file:// restriction; serve it over HTTP.`
  }
};
const WORKER_URL = 'https://groundline-live.astrovo1223.workers.dev';
let lang = localStorage.getItem('groundline-lang') || 'zh';

function renderStatic() {
  const t = I18N[lang];
  document.getElementById('tHeading').textContent = t.heading;
  document.getElementById('tCaveat').textContent = t.caveat;
  const dotStyles = [
    'background:var(--v-verified)', 'background:var(--v-wrong)', 'background:var(--v-uncertain)',
    'background:var(--v-subjective)', 'background:var(--v-self)',
    'background:var(--accent); border-radius:2px; width:8px; height:8px;'
  ];
  document.getElementById('tLegend').innerHTML = t.legend
    .map((label, i) => `<span><span class="dot" style="${dotStyles[i]}"></span>${label}</span>`)
    .join('');
  document.getElementById('tFooter').innerHTML =
    `← <a href="./index.html">${t.footerLink}</a>　·　${t.footerSrc}<code>data.json</code>`;
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
}

const COLORS = {
  verified: 'var(--v-verified)',
  inferred_wrong: 'var(--v-wrong)',
  uncertain: 'var(--v-uncertain)',
  subjective: 'var(--v-subjective)',
  self_report: 'var(--v-self)'
};
// Loudness: how tall a bar gets — bigger judgment, bigger block.
const AMP = { verified: 34, inferred_wrong: 90, uncertain: 20, subjective: 52, self_report: 60 };

const sourcesEl = document.getElementById('sources');
const tpl = document.getElementById('stageTpl');
const W = 1200, H = 300, MIDY = 150, EMO_Y = 258;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function renderSource(sourceName, records) {
  const frag = tpl.content.cloneNode(true);
  const h = frag.querySelector('.source-h');
  h.innerHTML = `${sourceName} <span class="n">· ${records.length} 筆</span>`;
  const svg = frag.querySelector('svg');
  const stage = frag.querySelector('.stage');
  const tip = frag.querySelector('.tip');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  sourcesEl.appendChild(frag);

  const n = records.length;
  const margin = 50;
  const step = (W - margin * 2) / Math.max(n, 1);
  const barW = Math.min(step * 0.58, 30);
  const points = records.map((r, i) => ({
    x: margin + step * i + step / 2,
    amp: AMP[r.evidence] || 24,
    color: COLORS[r.evidence] || 'var(--ink-dim)',
    r
  }));

  // Defs: glow filter (id scoped per source so multiple charts don't collide)
  const glowId = `glow-${sourceName.replace(/[^a-zA-Z0-9]/g, '')}`;
  const defs = ns('defs');
  defs.innerHTML = `
    <filter id="${glowId}" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Baseline / center line of the audio-track — the "zero" the bars rise from.
  const baseline = ns('line');
  baseline.setAttribute('x1', 0); baseline.setAttribute('x2', W);
  baseline.setAttribute('y1', MIDY); baseline.setAttribute('y2', MIDY);
  baseline.setAttribute('stroke', 'var(--line)'); baseline.setAttribute('stroke-width', '1');
  svg.appendChild(baseline);

  const lane = ns('text');
  lane.setAttribute('x', 6); lane.setAttribute('y', MIDY - 6);
  lane.setAttribute('class', 'lane-label'); lane.textContent = 'evidence';
  svg.appendChild(lane);

  const emoLane = ns('text');
  emoLane.setAttribute('x', 6); emoLane.setAttribute('y', EMO_Y + 14);
  emoLane.setAttribute('class', 'lane-label'); emoLane.textContent = 'self-report';
  svg.appendChild(emoLane);

  // Main track — a waveform meter, one symmetric bar per record. Height is
  // the "loudness": how significant the judgment was, not an emotion signal.
  points.forEach((p, i) => {
    const g = ns('g');
    g.setAttribute('class', 'bar-g');

    const bar = ns('rect');
    const bh = p.amp * 2;
    bar.setAttribute('x', (p.x - barW / 2).toFixed(1));
    bar.setAttribute('y', (MIDY - p.amp).toFixed(1));
    bar.setAttribute('width', barW.toFixed(1));
    bar.setAttribute('height', bh.toFixed(1));
    bar.setAttribute('rx', 2.5);
    bar.setAttribute('fill', p.color);
    bar.setAttribute('filter', `url(#${glowId})`);
    bar.setAttribute('class', 'track-bar');
    bar.style.animationDelay = `${(i * 0.27) % 4}s`;
    bar.style.transformOrigin = `${p.x}px ${MIDY}px`;
    bar.style.cursor = 'pointer';
    g.appendChild(bar);

    // self-report sub-lane: a small tick only for records carrying a free-text emotion
    let emoDot = null;
    if (p.r.emotion) {
      emoDot = ns('rect');
      emoDot.setAttribute('x', (p.x - 4).toFixed(1));
      emoDot.setAttribute('y', (EMO_Y - 4).toFixed(1));
      emoDot.setAttribute('width', 8); emoDot.setAttribute('height', 8);
      emoDot.setAttribute('rx', 2);
      emoDot.setAttribute('fill', 'var(--accent)');
      emoDot.setAttribute('class', 'emo-tick');
      emoDot.style.cursor = 'pointer';
      g.appendChild(emoDot);
    }

    svg.appendChild(g);

    const showTip = (emotion) => {
      tip.querySelector('.t-claim').textContent = emotion ? `「${p.r.emotion}」` : p.r.claim;
      const d = new Date(p.r.ts);
      const src = p.r.source ? ` · ${p.r.source}` : '';
      const label = emotion ? `${I18N[lang].evidenceLabel}${src}` : p.r.evidence + src;
      tip.querySelector('.t-meta').textContent = `${label} · ${d.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
      const rect = stage.getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const scale = svgRect.width / W;
      const ty = emotion ? EMO_Y - 12 : MIDY - p.amp - 10;
      tip.style.left = (svgRect.left - rect.left + p.x * scale) + 'px';
      tip.style.top = (svgRect.top - rect.top + ty * scale) + 'px';
      tip.classList.add('show');
    };
    bar.addEventListener('mouseenter', () => showTip(false));
    bar.addEventListener('mouseleave', () => tip.classList.remove('show'));
    if (emoDot) {
      emoDot.addEventListener('mouseenter', () => showTip(true));
      emoDot.addEventListener('mouseleave', () => tip.classList.remove('show'));
    }
  });
}

let lastRecords = null;

async function main() {
  if (lastRecords === null) {
    let data;
    try {
      const res = await fetch('./data.json', { cache: 'no-store' });
      data = await res.json();
    } catch (e) {
      sourcesEl.innerHTML = `<p style="color:#b3503f">${I18N[lang].errFetch(e.message)}</p>`;
      return;
    }
    let liveRecords = [];
    try {
      const liveRes = await fetch(`${WORKER_URL}/records`, { cache: 'no-store' });
      if (liveRes.ok) {
        const liveData = await liveRes.json();
        liveRecords = liveData.records || [];
      }
    } catch (_) {
      // Live worker unreachable — historical data still renders fine on its own.
    }
    lastRecords = [...data.records, ...liveRecords].sort((a, b) => new Date(a.ts) - new Date(b.ts));
  }
  sourcesEl.innerHTML = '';
  if (lastRecords.length === 0) return;

  const bySource = new Map();
  for (const r of lastRecords) {
    const key = r.source || '（未標記來源）';
    if (!bySource.has(key)) bySource.set(key, []);
    bySource.get(key).push(r);
  }
  for (const [sourceName, recs] of bySource) {
    renderSource(sourceName, recs);
  }
}

document.getElementById('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  try { localStorage.setItem('groundline-lang', lang); } catch (_) {}
  renderStatic();
  main();
});

renderStatic();
main();
</script>

<style>
/* Slow meter-breathing: a mixer bar isn't dead-still, but it's not a fast
   pulse either — a few seconds per cycle, gentle scale on the vertical axis. */
.track-bar {
  transform-box: fill-box;
  animation: bar-breathe 3.6s ease-in-out infinite;
}
.track-bar:hover { filter: brightness(1.15); }
@keyframes bar-breathe {
  0% { transform: scaleY(1); }
  50% { transform: scaleY(1.055); }
  100% { transform: scaleY(1); }
}
.emo-tick {
  transform-box: fill-box;
  transform-origin: center;
  animation: emo-breathe 2.8s ease-in-out infinite;
}
@keyframes emo-breathe {
  0% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.35); opacity: 1; }
  100% { transform: scale(1); opacity: 0.85; }
}
.lane-label {
  font-family: var(--mono); font-size: 9px; fill: var(--ink-dim);
  text-transform: uppercase; letter-spacing: 0.08em;
}
@media (prefers-reduced-motion: reduce) {
  .track-bar, .emo-tick { animation: none; }
}
</style>
