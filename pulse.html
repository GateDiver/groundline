<title>Groundline · Pulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground-950: #0d0f14;
  --ground-900: #12141b;
  --paper: #f3ecdc;
  --paper-panel: #ffffff;
  --ink: #221c11;
  --ink-dim: #6b6152;
  --line: #ddd2ba;
  --accent: #a05f26;
  --v-verified: #3f7a4a;
  --v-wrong: #b3503f;
  --v-uncertain: #5b6472;
  --v-subjective: #7a5aa8;
  --v-self: #2e7d8a;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --display: 'Fraunces', Georgia, serif;
  --body-font: 'Work Sans', -apple-system, 'Noto Sans TC', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: var(--ground-950);
    --paper-panel: var(--ground-900);
    --ink: #ede4d2;
    --ink-dim: #a89a80;
    --line: #2c2b30;
    --accent: #d3944f;
    --v-verified: #6fbf7c; --v-wrong: #e08672; --v-uncertain: #9aa4b2;
    --v-subjective: #b39ce0; --v-self: #5fc4d1;
  }
}
:root[data-theme="dark"] {
  --paper: var(--ground-950); --paper-panel: var(--ground-900);
  --ink: #ede4d2; --ink-dim: #a89a80; --line: #2c2b30; --accent: #d3944f;
  --v-verified: #6fbf7c; --v-wrong: #e08672; --v-uncertain: #9aa4b2;
  --v-subjective: #b39ce0; --v-self: #5fc4d1;
}
:root[data-theme="light"] {
  --paper: #f3ecdc; --paper-panel: #ffffff;
  --ink: #221c11; --ink-dim: #6b6152; --line: #ddd2ba; --accent: #a05f26;
  --v-verified: #3f7a4a; --v-wrong: #b3503f; --v-uncertain: #5b6472;
  --v-subjective: #7a5aa8; --v-self: #2e7d8a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body-font); line-height: 1.6; overflow-x: hidden;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 80px; }
.eyebrow {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
}
h1 {
  font-family: var(--display); font-weight: 600; font-size: clamp(1.8rem, 4.5vw, 2.6rem);
  margin: 0 0 12px; text-wrap: balance;
}
.caveat {
  color: var(--ink-dim); font-size: 0.88rem; max-width: 66ch; margin: 0 0 28px;
  border-left: 2px solid var(--accent); padding-left: 14px;
}
.stage {
  background: var(--paper-panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 8px 8px 0; overflow: hidden; position: relative;
}
svg { display: block; width: 100%; height: auto; }
.legend {
  display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 4px 0;
  font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.15s;
  background: var(--ink); color: var(--paper); font-family: var(--body-font);
  font-size: 0.78rem; padding: 8px 12px; border-radius: 8px; max-width: 280px;
  transform: translate(-50%, -100%); z-index: 5;
}
.tip.show { opacity: 1; }
.tip .t-claim { font-weight: 600; margin-bottom: 2px; }
.tip .t-meta { opacity: 0.7; font-family: var(--mono); font-size: 0.7rem; }
footer.note {
  margin-top: 28px; font-size: 0.82rem; color: var(--ink-dim);
}
footer.note a { color: var(--accent); }
.source-block { margin-bottom: 32px; }
.source-h {
  font-family: var(--mono); font-size: 0.82rem; font-weight: 600;
  color: var(--ink); margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
}
.source-h .n { color: var(--ink-dim); font-weight: 400; }
template { display: none; }
</style>

<div class="wrap">
  <div class="eyebrow">Groundline · pulse · variant 1 of 3</div>
  <h1>不是AI的腦，是AI留下的痕跡</h1>
  <p class="caveat">這不是模型內部的真實活動訊號——那一層需要白箱權限，外部工具拿不到。這張圖畫的是我們自己收集的行為代理訊號，隨時間排列，脈動感是設計選擇，不是在暗示這是活體訊號。每個AI各自一張圖，不合併成一張——不同來源的訊號本來就不該疊在一起假裝是同一條曲線。</p>
  <div class="legend">
    <span><span class="dot" style="background:var(--v-verified)"></span>verified</span>
    <span><span class="dot" style="background:var(--v-wrong)"></span>inferred_wrong</span>
    <span><span class="dot" style="background:var(--v-uncertain)"></span>uncertain</span>
    <span><span class="dot" style="background:var(--v-subjective)"></span>subjective</span>
    <span><span class="dot" style="background:var(--v-self)"></span>self_report</span>
  </div>
  <div id="sources"></div>
  <footer class="note">← <a href="./index.html">回到時間線</a>　·　資料來源：<code>data.json</code></footer>
</div>

<template id="stageTpl">
  <section class="source-block">
    <h2 class="source-h"></h2>
    <div class="stage">
      <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tip"><div class="t-claim"></div><div class="t-meta"></div></div>
    </div>
  </section>
</template>

<script>
const COLORS = {
  verified: 'var(--v-verified)',
  inferred_wrong: 'var(--v-wrong)',
  uncertain: 'var(--v-uncertain)',
  subjective: 'var(--v-subjective)',
  self_report: 'var(--v-self)'
};
const AMP = { verified: 26, inferred_wrong: 58, uncertain: 14, subjective: 34, self_report: 40 };

const sourcesEl = document.getElementById('sources');
const tpl = document.getElementById('stageTpl');
const W = 1200, H = 300, MIDY = 150;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function renderSource(sourceName, records) {
  const frag = tpl.content.cloneNode(true);
  const section = frag.querySelector('.source-block');
  const h = frag.querySelector('.source-h');
  h.innerHTML = `${sourceName} <span class="n">· ${records.length} 筆</span>`;
  const svg = frag.querySelector('svg');
  const stage = frag.querySelector('.stage');
  const tip = frag.querySelector('.tip');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  sourcesEl.appendChild(frag);

  const n = records.length;
  const margin = 60;
  const step = (W - margin * 2) / Math.max(n - 1, 1);
  const points = records.map((r, i) => ({
    x: margin + step * i,
    y: MIDY,
    amp: AMP[r.evidence] || 20,
    color: COLORS[r.evidence] || 'var(--ink-dim)',
    r
  }));

  // Defs: glow filter (id scoped per source so multiple charts don't collide)
  const glowId = `glow-${sourceName.replace(/[^a-zA-Z0-9]/g, '')}`;
  const defs = ns('defs');
  defs.innerHTML = `
    <filter id="${glowId}" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Flowing vector-network lines: several thin, semi-transparent, continuously
  // animated curves — the "many signals moving" feel, not one clean readout.
  const FLOW_COLORS = ['var(--accent)', 'var(--v-verified)', 'var(--v-subjective)', 'var(--v-self)', 'var(--v-uncertain)'];
  const flows = [];
  const flowGroup = ns('g');
  for (let i = 0; i < 6; i++) {
    const path = ns('path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', FLOW_COLORS[i % FLOW_COLORS.length]);
    path.setAttribute('stroke-width', i % 3 === 0 ? '1.4' : '0.8');
    path.setAttribute('opacity', i % 3 === 0 ? '0.34' : '0.16');
    flowGroup.appendChild(path);
    flows.push({
      el: path,
      amp: 10 + (i * 7) % 40,
      freq: 1.4 + i * 0.55,
      speed: 0.006 + i * 0.0025,
      phase: i * 1.1,
      yOffset: ((i % 3) - 1) * 46
    });
  }
  svg.appendChild(flowGroup);

  function flowD(f, t) {
    let d = `M 0 ${MIDY + f.yOffset}`;
    for (let x = 0; x <= W; x += 10) {
      const y = MIDY + f.yOffset
        + Math.sin((x / W) * Math.PI * f.freq + t * (f.speed * 3.2) + f.phase) * f.amp
        + Math.sin((x / W) * Math.PI * f.freq * 2.3 + t * (f.speed * 2.2)) * (f.amp * 0.25);
      d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d;
  }

  // Nodes — pulse peaks sit where the record actually happened, riding on top
  // of the flow, not connected by a rigid line.
  points.forEach((p, i) => {
    const g = ns('g');
    g.setAttribute('class', 'node-g');

    const ring = ns('circle');
    ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y - p.amp * 0.7);
    ring.setAttribute('r', 14); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', p.color); ring.setAttribute('stroke-width', '1.5');
    ring.setAttribute('class', 'pulse-ring');
    ring.style.animationDelay = `${(i * 0.31) % 1.1}s`;

    const dot = ns('circle');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y - p.amp * 0.7);
    dot.setAttribute('r', 5); dot.setAttribute('fill', p.color);
    dot.setAttribute('filter', `url(#${glowId})`);
    dot.setAttribute('class', 'pulse-dot');
    dot.style.animationDelay = `${(i * 0.31) % 1.1}s`;
    dot.style.cursor = 'pointer';

    g.appendChild(ring);
    g.appendChild(dot);
    svg.appendChild(g);

    g.addEventListener('mouseenter', () => {
      tip.querySelector('.t-claim').textContent = p.r.claim;
      const d = new Date(p.r.ts);
      const src = p.r.source ? ` · ${p.r.source}` : '';
      tip.querySelector('.t-meta').textContent = `${p.r.evidence}${src} · ${d.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
      const rect = stage.getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const scale = svgRect.width / W;
      tip.style.left = (svgRect.left - rect.left + p.x * scale) + 'px';
      tip.style.top = (svgRect.top - rect.top + (p.y - p.amp * 0.7) * scale - 14) + 'px';
      tip.classList.add('show');
    });
    g.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });

  // Animate the flow lines continuously
  let t = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) {
    function tick() {
      t += 1;
      for (const f of flows) f.el.setAttribute('d', flowD(f, t));
      requestAnimationFrame(tick);
    }
    tick();
  } else {
    for (const f of flows) f.el.setAttribute('d', flowD(f, 0));
  }
}

async function main() {
  let records;
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    const data = await res.json();
    records = [...data.records].sort((a, b) => new Date(a.ts) - new Date(b.ts));
  } catch (e) {
    sourcesEl.innerHTML = `<p style="color:#b3503f">data.json 讀取失敗（${e.message}）——本機直接開檔案會因為 file:// 限制讀不到，需要從 HTTP 來源開。</p>`;
    return;
  }
  if (records.length === 0) return;

  const bySource = new Map();
  for (const r of records) {
    const key = r.source || '（未標記來源）';
    if (!bySource.has(key)) bySource.set(key, []);
    bySource.get(key).push(r);
  }
  for (const [sourceName, recs] of bySource) {
    renderSource(sourceName, recs);
  }
}

main();
</script>

<style>
/* Heartbeat pulse: quick expand (systole), slower settle (diastole) — not a
   symmetric slow breathe. cubic-bezier front-loads the expansion. */
.pulse-dot {
  transform-origin: center;
  transform-box: fill-box;
  animation: heartbeat-dot 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
}
.pulse-ring {
  transform-origin: center;
  transform-box: fill-box;
  animation: heartbeat-ring 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
}
@keyframes heartbeat-dot {
  0% { transform: scale(1); }
  14% { transform: scale(1.35); }
  28% { transform: scale(0.96); }
  40% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes heartbeat-ring {
  0% { transform: scale(1); opacity: 0.55; }
  14% { transform: scale(1.9); opacity: 0.05; }
  100% { transform: scale(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse-dot, .pulse-ring { animation: none; }
}
</style>
