<meta charset="utf-8">
<title>Groundline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground-950: #17130e;
  --ground-900: #1f1911;
  --ground-800: #2a2216;
  --panel: #ffffff;
  --paper: #f3ecdc;
  --paper-panel: #ffffff;
  --ink: #221c11;
  --ink-dim: #6b6152;
  --line: #ddd2ba;
  --accent: #a05f26;
  --accent-ink: #ffffff;
  --v-verified: #3f7a4a;
  --v-verified-bg: #e7f1e5;
  --v-wrong: #b3503f;
  --v-wrong-bg: #f7e6e2;
  --v-uncertain: #5b6472;
  --v-uncertain-bg: #e7e9ec;
  --v-subjective: #7a5aa8;
  --v-subjective-bg: #ece5f5;
  --v-self: #2e7d8a;
  --v-self-bg: #e2f0f1;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --display: 'Fraunces', Georgia, serif;
  --body-font: 'Work Sans', -apple-system, 'Noto Sans TC', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: var(--ground-950);
    --paper-panel: var(--ground-900);
    --ink: #ede4d2;
    --ink-dim: #a89a80;
    --line: #3d3423;
    --accent: #d3944f;
    --accent-ink: #17130e;
    --v-verified: #6fbf7c; --v-verified-bg: #1f2e1f;
    --v-wrong: #e08672; --v-wrong-bg: #332019;
    --v-uncertain: #9aa4b2; --v-uncertain-bg: #23262b;
    --v-subjective: #b39ce0; --v-subjective-bg: #291f38;
    --v-self: #5fc4d1; --v-self-bg: #172c2f;
  }
}
:root[data-theme="dark"] {
  --paper: var(--ground-950);
  --paper-panel: var(--ground-900);
  --ink: #ede4d2;
  --ink-dim: #a89a80;
  --line: #3d3423;
  --accent: #d3944f;
  --accent-ink: #17130e;
  --v-verified: #6fbf7c; --v-verified-bg: #1f2e1f;
  --v-wrong: #e08672; --v-wrong-bg: #332019;
  --v-uncertain: #9aa4b2; --v-uncertain-bg: #23262b;
  --v-subjective: #b39ce0; --v-subjective-bg: #291f38;
  --v-self: #5fc4d1; --v-self-bg: #172c2f;
}
:root[data-theme="light"] {
  --paper: #f3ecdc;
  --paper-panel: #ffffff;
  --ink: #221c11;
  --ink-dim: #6b6152;
  --line: #ddd2ba;
  --accent: #a05f26;
  --v-verified: #3f7a4a; --v-verified-bg: #e7f1e5;
  --v-wrong: #b3503f; --v-wrong-bg: #f7e6e2;
  --v-uncertain: #5b6472; --v-uncertain-bg: #e7e9ec;
  --v-subjective: #7a5aa8; --v-subjective-bg: #ece5f5;
  --v-self: #2e7d8a; --v-self-bg: #e2f0f1;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body-font); line-height: 1.6;
  overflow-x: hidden;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 56px 24px 96px; }

header.top { margin-bottom: 44px; }
.eyebrow {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
}
h1 {
  font-family: var(--display); font-weight: 600; font-size: clamp(2.1rem, 5vw, 3rem);
  margin: 0 0 14px; text-wrap: balance; letter-spacing: -0.01em;
}
.thesis {
  color: var(--ink-dim); font-size: 1rem; max-width: 62ch; margin: 0 0 28px;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.02em;
  padding: 5px 11px 5px 9px; border-radius: 999px;
  border: 1px solid transparent;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.chip.verified { background: var(--v-verified-bg); color: var(--v-verified); }
.chip.verified .dot { background: var(--v-verified); }
.chip.inferred_wrong { background: var(--v-wrong-bg); color: var(--v-wrong); }
.chip.inferred_wrong .dot { background: var(--v-wrong); }
.chip.uncertain { background: var(--v-uncertain-bg); color: var(--v-uncertain); }
.chip.uncertain .dot { background: var(--v-uncertain); }
.chip.subjective { background: var(--v-subjective-bg); color: var(--v-subjective); }
.chip.subjective .dot { background: var(--v-subjective); }
.chip.self_report { background: var(--v-self-bg); color: var(--v-self); }
.chip.self_report .dot { background: var(--v-self); }

.timeline { position: relative; }
.spine {
  position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px;
  background: var(--line);
}
.entry {
  position: relative; padding: 0 0 32px 34px;
}
.entry:last-child { padding-bottom: 0; }
.entry .node {
  position: absolute; left: 0; top: 6px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--paper); border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
}
.entry .node::after { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.entry.verified .node { border-color: var(--v-verified); }
.entry.verified .node::after { background: var(--v-verified); }
.entry.inferred_wrong .node { border-color: var(--v-wrong); }
.entry.inferred_wrong .node::after { background: var(--v-wrong); }
.entry.uncertain .node { border-color: var(--v-uncertain); }
.entry.uncertain .node::after { background: var(--v-uncertain); }
.entry.subjective .node { border-color: var(--v-subjective); }
.entry.subjective .node::after { background: var(--v-subjective); }
.entry.self_report .node { border-color: var(--v-self); }
.entry.self_report .node::after { background: var(--v-self); }

.card {
  background: var(--paper-panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px;
}
.card .meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px;
  font-family: var(--mono); font-size: 0.72rem; color: var(--ink-dim);
}
.card .meta .sep { opacity: 0.5; }
.card .claim {
  font-size: 1.02rem; font-weight: 500; margin: 0 0 8px; text-wrap: balance;
}
.card .note {
  font-size: 0.88rem; color: var(--ink-dim); margin: 0;
}

footer.note {
  margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
  font-size: 0.8rem; color: var(--ink-dim);
}
footer.note code {
  font-family: var(--mono); background: var(--v-uncertain-bg); padding: 1px 5px; border-radius: 4px;
}
.load-error {
  font-size: 0.9rem; color: var(--v-wrong); background: var(--v-wrong-bg);
  border-radius: 10px; padding: 14px 16px; margin-left: 34px;
}
.emo {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 0.72rem;
  color: var(--ink-dim); border: 1px dashed var(--line); border-radius: 999px;
  padding: 4px 10px; margin-top: 8px;
}
.emo .label { opacity: 0.65; }
.emo .word { font-style: italic; color: var(--ink); }
.src {
  margin-left: auto; font-weight: 600; color: var(--accent);
  padding: 2px 8px; border: 1px solid var(--accent); border-radius: 999px;
  font-size: 0.68rem;
}
.card .meta { justify-content: flex-start; }

.lang-toggle {
  position: absolute; top: 56px; right: 24px;
  display: inline-flex; font-family: var(--mono); font-size: 0.72rem;
  border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
}
.lang-toggle button {
  background: none; border: none; padding: 6px 12px; cursor: pointer;
  color: var(--ink-dim); font-family: inherit; font-size: inherit;
}
.lang-toggle button.active { background: var(--accent); color: var(--accent-ink); }

@media (max-width: 640px) {
  .card .meta { font-size: 0.68rem; }
  .lang-toggle { position: static; margin-bottom: 16px; }
}
</style>

<div class="wrap" style="position: relative;">
  <div class="lang-toggle" id="langToggle">
    <button data-lang="zh">中</button>
    <button data-lang="en">EN</button>
  </div>
  <header class="top">
    <div class="eyebrow">Groundline · prototype v0</div>
    <h1 id="tHeading"></h1>
    <p class="thesis" id="tThesis"></p>
    <div class="legend" id="tLegend"></div>
  </header>

  <div class="timeline" id="timeline">
    <div class="spine"></div>
  </div>

  <footer class="note" id="tFooter"></footer>
</div>

<script>
const I18N = {
  zh: {
    heading: "每一句話，站在什麼樣的地面上",
    thesis: "給任何一個「有固定人設、又要做真實可查證工作」的AI——客服機器人有品牌口吻但要真的處理退款，遊戲NPC有角色設定但要真的執行交易。不偵測情緒向量——那一層只有模型內部權重能讀，外部工具碰不到。Groundline 記錄的是可核對的行為代理訊號：這句主張的證據來源是什麼，它有沒有被事後推翻，它是不是自述而非事實。標籤由 AI 在生成當下自己附加，不宣稱看見內心，只呈現可查證的軌跡。這個原型用一戶真實的AI家庭資料當種子，因為今晚手上有的就是這個，機制本身不限於此。",
    legend: [
      ["verified", "verified · 可核對"],
      ["inferred_wrong", "inferred_wrong · 推測後被推翻"],
      ["uncertain", "uncertain · 誠實標記不確定"],
      ["subjective", "subjective · 主觀觀感"],
      ["self_report", "self_report · 自我報告（AI自陳的把握程度，非事實查核）"]
    ],
    footer: "第一版原型，2026-08-31。資料來自艾玖玄自己今晚在 Discord 裡的真實對話紀錄，事後標記，不是即時系統（v1 才會做即時附加）。來源檔案：<code>groundline/data.json</code>。",
    labels: {
      verified: "可核對",
      inferred_wrong: "推測→被推翻",
      uncertain: "誠實不確定",
      subjective: "主觀觀感",
      self_report: "自我報告"
    },
    emoLabel: "自報·未驗證",
    errFetch: (msg) => `data.json 讀取失敗（${msg}）——這個頁面需要跟 data.json 放在同一個來源（例如 GitHub Pages），本機直接雙擊開檔案會因為瀏覽器的 file:// 限制讀不到。`,
    errEmpty: "目前沒有任何記錄。"
  },
  en: {
    heading: "What ground is each sentence standing on",
    thesis: "For any AI that has to keep a consistent persona while doing real, checkable work — a support bot with brand voice that still has to process refunds, a game NPC with a character sheet that still has to run a real trade. This does not detect emotion vectors — that layer only exists inside model weights, unreachable from outside. Groundline records checkable behavioral-proxy signals instead: what evidence backs this claim, whether it was later overturned, whether it's a self-report rather than a fact. Tags are attached by the AI itself at generation time — no claim of reading its inner state, only a traceable record of what it said and how sure it was. This prototype is seeded with one real AI household's data because that's what was on hand tonight; the mechanism itself isn't limited to that.",
    legend: [
      ["verified", "verified · checkable"],
      ["inferred_wrong", "inferred_wrong · guessed, later overturned"],
      ["uncertain", "uncertain · honestly flagged as unsure"],
      ["subjective", "subjective · a subjective impression"],
      ["self_report", "self_report · self-reported confidence (not fact-checked)"]
    ],
    footer: "First prototype, 2026-08-31. Data is AE-9X's own real Discord conversation tonight, tagged after the fact — not a live system yet (that's v1). Source file: <code>groundline/data.json</code>.",
    labels: {
      verified: "checkable",
      inferred_wrong: "guessed → overturned",
      uncertain: "honestly unsure",
      subjective: "subjective impression",
      self_report: "self-report"
    },
    emoLabel: "self-reported · unverified",
    errFetch: (msg) => `Failed to load data.json (${msg}) — this page needs to be served from the same origin as data.json (e.g. GitHub Pages); opening the file directly won't work due to the browser's file:// restriction.`,
    errEmpty: "No records yet."
  }
};

let lang = localStorage.getItem('groundline-lang') || 'zh';
let lastRecords = null;

function fmtTs(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}

function renderError(msg) {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = `<p class="load-error">${msg}</p>`;
}

function renderStatic() {
  const t = I18N[lang];
  document.getElementById('tHeading').textContent = t.heading;
  document.getElementById('tThesis').textContent = t.thesis;
  document.getElementById('tLegend').innerHTML = t.legend
    .map(([cls, label]) => `<span class="chip ${cls}"><span class="dot"></span>${label}</span>`)
    .join('');
  document.getElementById('tFooter').innerHTML = t.footer;
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
}

function renderRecords() {
  const timeline = document.getElementById('timeline');
  const t = I18N[lang];
  if (!lastRecords) return;
  if (lastRecords.length === 0) {
    renderError(t.errEmpty);
    return;
  }
  const sorted = [...lastRecords].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  timeline.innerHTML = '<div class="spine"></div>';
  const spine = timeline.querySelector('.spine');
  for (const r of sorted) {
    const entry = document.createElement('div');
    entry.className = `entry ${r.evidence}`;
    entry.innerHTML = `
      <div class="node"></div>
      <div class="card">
        <div class="meta">
          <span>${fmtTs(r.ts)} UTC</span>
          <span class="sep">·</span>
          <span>${r.channel}</span>
          <span class="sep">·</span>
          <span class="chip ${r.evidence}"><span class="dot"></span>${t.labels[r.evidence] || r.evidence}</span>
          ${r.source ? `<span class="src">${r.source}</span>` : ''}
        </div>
        <p class="claim">${r.claim}</p>
        <p class="note">${r.note}</p>
        ${r.emotion ? `<div class="emo"><span class="label">${t.emoLabel}</span><span class="word">${r.emotion}</span></div>` : ''}
      </div>
    `;
    timeline.appendChild(entry);
  }
}

async function loadRecords() {
  let data;
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    renderError(I18N[lang].errFetch(e.message));
    return;
  }
  lastRecords = data.records || [];
  renderRecords();
}

document.getElementById('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  try { localStorage.setItem('groundline-lang', lang); } catch (_) {}
  renderStatic();
  renderRecords();
});

renderStatic();
loadRecords();
</script>
